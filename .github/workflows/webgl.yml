# Compila StickMan Arena para WebGL con GameCI y lo publica en GitHub Pages.
# Secretos necesarios (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE  contenido del archivo .ulf de la licencia Personal (ver docs/licencia-unity.md)
#   UNITY_EMAIL    correo de la cuenta Unity
#   UNITY_PASSWORD contraseña de la cuenta Unity
name: WebGL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: webgl-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write   # unity-test-runner publica el resultado como check (githubToken)
  pages: write
  id-token: write

jobs:
  test:
    name: Pruebas (EditMode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          # v2: una Library restaurada de una ejecución anterior idéntica hacía fallar al test runner
          # sin producir resultados; la caché solo se reutiliza entre commits distintos.
          key: Library-test-v2-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}-${{ github.run_id }}
          restore-keys: Library-test-v2-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          artifactsPath: TestResults
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      # Solo el resumen de fallos va al log, para que Claude lea poco (ahorro de tokens)
      - name: Resumen de pruebas
        if: always()
        run: python3 tools/ci/test-summary.py TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: TestResults
          retention-days: 7

  build:
    name: Build WebGL
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-webgl-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-webgl-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: StickmanArena.EditorTools.BuildScript.BuildWebGL
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        with:
          name: webgl
          path: build/WebGL/StickManArena
          retention-days: 14
      - name: Preparar Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/StickManArena

  deploy:
    name: Publicar en GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
